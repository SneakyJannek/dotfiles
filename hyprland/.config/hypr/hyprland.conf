# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

################
### MONITORS ###
################


monitor= DP-1,1920x1080@100.00Hz,auto,auto
monitor= DP-2,1920x1080@60.00Hz,auto,auto
monitor= HDMI-A-1,1920x1080,auto,auto,mirror,DP-1

###################
### MY PROGRAMS ###
###################

# Set programs that you use
$terminal = kitty
$fileManager = nemo 
$menu = wofi --show
$browser = firefox


#################
### AUTOSTART ###
#################

exec-once = waybar & hyprpaper &

exec-once = steam -silent &
exec-once = discord --start-minimized &

exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORMTHEME,qt5ct


###################
### PERMISSIONS ###
###################

# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 20

    border_size = 1

    col.active_border = rgba(33ccffee) #rgba(ff0033ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
    
}

decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    #inactive_opacity = 0.6

    shadow {
        enabled = true
        range = 5
        render_power = 3
        color = rgba(1a1a1a1a)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# "Smart gaps"
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = border_size 0, match:float 0, match:workspace w[tv1]

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

windowrule {
    name = steam_round
    match:class = steam_app_.*
    rounding = 0
}

input {
    follow_mouse = 0
}

workspace = 1, monitor:DP-1
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2

windowrule = match:class discord, workspace 2
windowrule = match:class spotify, workspace 2
windowrule = match:class steam, match:title Steam, workspace 3
windowrule = match:class steam_app_.*, workspace 1
windowrule = match:class steam_app_1454400, workspace special:magic


#############
### INPUT ###
#############

input {
    kb_layout = de 
    kb_variant = nodeadkeys
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

gesture = 3, horizontal, workspace

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER # Sets "Windows" key as main modifier
bind = CTRL ALT, T, exec, $terminal
bind = $mainMod, RETURN, exec, $terminal

bind = $mainMod, Q, killactive,
bind = $mainMod, F1, exec, /sbin/shutdown -a now
bind = $mainMod, F2, exec, /sbin/reboot
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, M, exit 

bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, fullscreenstate, 1
bind = $mainMod, B, exec, $browser
bind = $mainMod, N, exec, brave
bind = $mainMod, S, exec, spotify-launcher
bind = $mainMod, D, exec, discord
bind = $mainMod, G, exec, steam
bind = $mainMod, P, exec, pavucontrol
bind = $mainMod, Z, exec, zapzap
bind = $mainMod, U, exec, signal-desktop

# Screenshot
bind = $mainMod+CTRL, S, exec, /usr/sbin/hyprshot -m window -m active --clipboard-only
bind = $mainMod+SHIFT, S, exec, /usr/sbin/hyprshot -m region -z --clipboard-only
bind = $mainMod, F10, exec, /usr/sbin/hyprshot -m output -m HDMI-A-1 -o ~/Pictures

# Clipboard
bind = $mainMod, K, exec, cliphist list | wofi --dmenu --pre-display-cmd "echo '%s' | cut -f 2" | cliphist decode | wl-copy

# Move window with arrow keys
bind = $mainMod CTRL, left, swapwindow, l
bind = $mainMod CTRL, right, swapwindow, r
bind = $mainMod CTRL, up, swapwindow, u
bind = $mainMod CTRL, down, swapwindow, d


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, KP_END, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, KP_DOWN, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, KP_PAGE_DOWN, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, KP_LEFT, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, KP_BEGIN, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, KP_RIGHT, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, KP_HOME, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, KP_UP, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, KP_PAGE_UP, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, KP_0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, KP_END, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, KP_DOWN, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, KP_PAGE_DOWN, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, KP_LEFT, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, KP_BEGIN, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, KP_RIGHT, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, KP_HOME, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, KP_UP, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, KP_PAGE_UP, movetoworkspace, 9

# Example special workspace (scratchpad)
bind = $mainMod, asciicircum, togglespecialworkspace, magic
bind = $mainMod SHIFT, asciicircum, movetoworkspace, special:magic

# Resize window through keyboard input
binde = $mainMod Alt, left, resizeactive, -20 0 
binde = $mainMod Alt, right, resizeactive, 20 00
binde = $mainMod Alt, up, resizeactive, 0 -20 
binde = $mainMod Alt, down, resizeactive, 0 20 

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps. You'll probably like this.
#windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
#windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
